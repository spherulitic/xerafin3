name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      services:
        description: 'JSON array of test suites to run, e.g. ["cardbox","quiz"]; empty runs everything'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      services:
        description: 'JSON array of test suites to run; empty runs everything, [] runs nothing'
        required: false
        default: ''
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
      frontend: ${{ steps.list.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The caller passes the suites that changed and have tests. Without an
      # input, discover every suite, which is what PR runs do. An explicitly
      # empty array is legitimate: it means the change cannot affect any
      # suite (e.g. a versions.json bump).
      - name: Resolve test suites
        id: list
        env:
          SERVICES_INPUT: ${{ inputs.services }}
        run: |
          set -euo pipefail
          if [ -n "$SERVICES_INPUT" ]; then
            SUITES=$(printf '%s' "$SERVICES_INPUT" \
              | jq -c -e 'if type == "array" then . else error("services must be a JSON array") end')
          else
            # Every top-level dir with a tests/ directory is a pytest suite.
            # frontend/js-tests does not match that glob, so add it here.
            SUITES=$(git ls-files | grep -oE '^[^/]+/tests/' | cut -d/ -f1 | sort -u \
              | jq -R . | jq -s -c '. + ["frontend"] | unique')
          fi
          echo "Suites: $SUITES"
          # frontend runs in its own job; everything else in the pytest matrix.
          echo "services=$(jq -c '[.[] | select(. != "frontend")]' <<< "$SUITES")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(jq -r 'index("frontend") != null' <<< "$SUITES")" >> "$GITHUB_OUTPUT"

  test:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Build the real service image so tests run against the exact runtime
      # (python, mysqlclient, etc.) that ships. tests/ is in .dockerignore, so
      # mount the working tree over /app to run the current tests.
      - name: Build ${{ matrix.service }} image
        run: docker build -t x-${{ matrix.service }}:test ${{ matrix.service }}

      - name: Run ${{ matrix.service }} tests
        run: |
          docker run --rm --user root \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/${{ matrix.service }}:/app" \
            x-${{ matrix.service }}:test \
            sh -c "pip install -q -r requirements-test.txt && python -m pytest tests -q -p no:cacheprovider"

  frontend-js:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/js-tests/package-lock.json

      - name: Install frontend test deps
        working-directory: frontend/js-tests
        run: npm ci

      - name: Run frontend js tests
        working-directory: frontend/js-tests
        run: npm test

  # The single stable check name for branch protection: the matrix job names
  # change whenever a service gains a tests/ directory, this one does not.
  tests-required:
    needs:
      - detect
      - test
      - frontend-js
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every suite passed or was skipped
        run: |
          set -euo pipefail
          echo "detect: ${{ needs.detect.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "frontend-js: ${{ needs.frontend-js.result }}"
          for result in "${{ needs.detect.result }}" "${{ needs.test.result }}" "${{ needs.frontend-js.result }}"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Test suite did not pass ($result)"
                exit 1
                ;;
            esac
          done
