        # chat service endpoints
        location /getChatsInit {
                proxy_pass http://$svc_chat$request_uri;
        }
        location /getChats {
                proxy_pass http://$svc_chat$request_uri;
	}
        location /submitChat {
                proxy_pass http://$svc_chat$request_uri;
        }
