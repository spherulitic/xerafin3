        }
        location /getInvaderHighScores {
                proxy_pass http://$svc_sloth$request_uri;
        }
        location /setInvaderHighScores {
                proxy_pass http://$svc_sloth$request_uri;
        }

        # x-cardbox service endpoints
        #
	location /initCardbox {
		proxy_pass http://$svc_cardbox$request_uri;
	}
        location /getCardboxScore {
                proxy_pass http://$svc_cardbox$request_uri;
        }

        location /getCardboxStats {
                proxy_pass http://$svc_cardbox$request_uri;
        }
        location /getNextBingo {
                proxy_pass http://$svc_cardbox$request_uri;
        }

        location /getAuxInfo {
		proxy_pass http://$svc_cardbox$request_uri;
	}
        location /shameList {
                proxy_pass http://$svc_cardbox$request_uri;
        }
        location /triumphList {
                proxy_pass http://$svc_cardbox$request_uri;
        }
        location /uploadNewWordList {
                proxy_pass http://$svc_cardbox$request_uri;
        }
        location /uploadCardbox {
                client_max_body_size 10M;
                proxy_pass http://$svc_cardbox$request_uri;
        }
        location /downloadCardbox {
