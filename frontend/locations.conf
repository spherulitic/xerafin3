# Locations now being included in a server block in default.conf.dev or default.conf.prod

# Upstreams are resolved per request through podman's DNS (see nginx.conf)
# instead of at config-load time, so nginx starts even when a neighbour is
# down and picks up a new container IP without a restart.
set $svc_login   login:5000;
set $svc_stats   stats:5000;
set $svc_sloth   sloth:5000;
set $svc_cardbox cardbox:5000;
set $svc_quiz    quiz:5000;
set $svc_lexicon lexicon:5000;
set $svc_chat    chat:5000;

# Fail fast when a backend is down instead of hanging for the default 60s.
proxy_connect_timeout 5s;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
                root /usr/share/nginx/html;
                index index.htm index.html;
                # Always revalidate static assets (js, json config, html) so
                # newly deployed files are served instead of stale caches.
                add_header Cache-Control "no-cache";
		try_files $uri $uri/ =404;
	}

        # x-login service endpoints
        #
        location /login {
                proxy_pass http://$svc_login$request_uri;
        }
        location /getNavbar {
                proxy_pass http://$svc_login$request_uri;
        }
        location /getUserLexicons {
                proxy_pass http://$svc_login$request_uri;
        }
        location /getCountries {
                proxy_pass http://$svc_login$request_uri;
        }
        location /createCardboxPrefs {
                proxy_pass http://$svc_login$request_uri;
        }
        location /setCardboxPrefs {
                proxy_pass http://$svc_login$request_uri;
        }
        location /getLoggedInUsers {
                proxy_pass http://$svc_login$request_uri;
        }

        location /uploadProfileImage {
                client_max_body_size 5M;
                proxy_pass http://$svc_login$request_uri;
        }

        # x-stats service endpoints
        #
        location /getAllTimeStats {
                proxy_pass http://$svc_stats$request_uri;
        }
        location /getRankings {
                proxy_pass http://$svc_stats$request_uri;
        }
        location /get_site_records {
                proxy_pass http://$svc_stats$request_uri;
        }
        location /get_my_records {
                proxy_pass http://$svc_stats$request_uri;
        }
        location /get_individual_records {
                proxy_pass http://$svc_stats$request_uri;
        }
        # x-sloth service endpoints
        location /getSlothRankings {
                proxy_pass http://$svc_sloth$request_uri;
        }
        location /getSlothStats {
                proxy_pass http://$svc_sloth$request_uri;
        }
        location /slothWriteActive {
                proxy_pass http://$svc_sloth$request_uri;
        }
        location /slothAbortActive {
                proxy_pass http://$svc_sloth$request_uri;
        }
        location /slothComplete {
