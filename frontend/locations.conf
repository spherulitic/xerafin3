        }
        # x-quiz service endpoints
        #
        location /getQuizList {
                proxy_pass http://$svc_quiz$request_uri;
        }

        location /getSubscriptions {
                proxy_pass http://$svc_quiz$request_uri;
        }
	location /newQuiz {
		proxy_pass http://$svc_quiz$request_uri;
	}
	location /activateQuiz {
		proxy_pass http://$svc_quiz$request_uri;
	}
	location /getQuestions {
		proxy_pass http://$svc_quiz$request_uri;
	}
	location /submitQuestion {
